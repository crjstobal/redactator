[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redactator"
version = "0.1.0"
description = "Hide personal data in photos, PDFs and videos, entirely on your own computer."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
  "gliner2>=2.1",
  "imageio-ffmpeg>=0.5",
  "numpy>=1.26",
  "ollama>=0.5",
  "onnxruntime>=1.18",
  "opencv-python>=4.10",
  "pillow>=10",
  "pydantic>=2",
  "pymupdf>=1.24",
  "pywebview>=5",
  "rapidocr>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
redactator = "redactator.cli:main"

[project.gui-scripts]
redactator-app = "redactator.app.main:main"

[tool.setuptools.packages.find]
include = ["redactator*"]

[tool.setuptools.package-data]
"redactator.app" = ["web/*", "web/fonts/*"]
